version: '3'
services:
  postgres-management:
    image: postgres:alpine
    container_name: postgres-management-system
    environment:
      POSTGRES_DB: patient_management_system
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      PGDATA: /data/postgres
    expose:
      - "5432"
    volumes:
      - ./postgres-management:/data/postgres